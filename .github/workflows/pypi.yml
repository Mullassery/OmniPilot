name: Publish to PyPI

# Publishes `omnipilot-client` and the `omnipilot` runtime whenever a version
# tag (vX.Y.Z) is pushed, or manually via workflow_dispatch.
#
# Auth: PyPI API token stored in the repository secret `PYPI_API_TOKEN`
# (username `__token__`). `skip-existing: true` makes re-runs idempotent.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or ref to build and publish (e.g. v1.1.0)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install --upgrade build twine
      - name: Build omnipilot-client
        working-directory: packages/omnipilot-client
        run: python -m build --outdir ../../dist
      - name: Build omnipilot
        run: python -m build --outdir dist
      - name: Check distributions
        run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
