[workspace]
resolver = "2"
members = [
    "crates/omnipilot-core",
    "crates/omnipilot-protocol",
    "crates/omnipilot-engine",
    "crates/omnipilot-mock",
    "crates/omnipilot-ios",
    "crates/omnipilot-mcp",
    "crates/omnipilot-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Mullassery/OmniPilot"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rmcp = { version = "3.6", features = ["server", "macros", "transport-io"] }
schemars = { version = "1", features = ["uuid1", "chrono04"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
