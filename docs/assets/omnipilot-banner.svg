<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="OmniPilot — verification-first mobile automation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="0.55" stop-color="#111A33"/>
      <stop offset="1" stop-color="#0A1226"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#60A5FA"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.15" cy="0.2" r="0.75">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.045"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="340" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="28" fill="url(#grid)"/>
  <circle cx="210" cy="80" r="260" fill="url(#glow)"/>
  <circle cx="1080" cy="300" r="210" fill="#60A5FA" opacity="0.08" filter="url(#soft)"/>

  <g transform="translate(76 92)">
    <rect width="148" height="148" rx="38" fill="#0E1730" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="74" cy="74" r="42" fill="none" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="74" cy="74" r="13" fill="#5EEAD4"/>
    <path d="M74 16V42M74 106V132M16 74H42M106 74H132" stroke="#60A5FA" stroke-width="3" stroke-linecap="round"/>
    <path d="M103 45L117 31" stroke="#A78BFA" stroke-width="3" stroke-linecap="round"/>
    <circle cx="121" cy="27" r="7" fill="#A78BFA"/>
  </g>

  <text x="272" y="145" fill="#F8FAFC" font-family="'SF Pro Display','Segoe UI',system-ui,-apple-system,sans-serif" font-size="78" font-weight="700" letter-spacing="-2">OmniPilot</text>
  <text x="276" y="196" fill="#B8C4DC" font-family="'SF Pro Text','Segoe UI',system-ui,-apple-system,sans-serif" font-size="27" font-weight="400">Verification-first mobile automation for iOS and Android</text>

  <g font-family="'SF Pro Text','Segoe UI',system-ui,-apple-system,sans-serif" font-size="15" font-weight="600" letter-spacing="1.4">
    <rect x="276" y="228" width="112" height="34" rx="17" fill="#5EEAD4" fill-opacity="0.12" stroke="#5EEAD4" stroke-opacity="0.35"/>
    <text x="332" y="250" text-anchor="middle" fill="#99F6E4">OBSERVE</text>
    <rect x="400" y="228" width="86" height="34" rx="17" fill="#60A5FA" fill-opacity="0.12" stroke="#60A5FA" stroke-opacity="0.35"/>
    <text x="443" y="250" text-anchor="middle" fill="#BFDBFE">ACT</text>
    <rect x="498" y="228" width="106" height="34" rx="17" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.35"/>
    <text x="551" y="250" text-anchor="middle" fill="#DDD6FE">VERIFY</text>
    <rect x="616" y="228" width="96" height="34" rx="17" fill="#F8FAFC" fill-opacity="0.08" stroke="#F8FAFC" stroke-opacity="0.22"/>
    <text x="664" y="250" text-anchor="middle" fill="#E2E8F0">PROVE</text>
  </g>

  <g opacity="0.9">
    <text x="1204" y="98" text-anchor="end" fill="#94A3B8" font-family="'SF Mono','Cascadia Code',monospace" font-size="14">omnipilot.adapter/1</text>
    <text x="1204" y="124" text-anchor="end" fill="#5EEAD4" font-family="'SF Mono','Cascadia Code',monospace" font-size="14">verified: true</text>
  </g>
</svg>
